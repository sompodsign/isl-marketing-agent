services:
  marketing-agent:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: isl_marketing_agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      ENABLE_INTERNAL_SCHEDULER: "true"
      MARKETING_AGENT_DATA_DIR: /app/data
    ports:
      - "${APP_PORT:-8020}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
