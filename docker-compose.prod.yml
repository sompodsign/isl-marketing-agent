services:
  marketing-agent:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: isl_marketing_agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      ENABLE_INTERNAL_SCHEDULER: "true"
      MARKETING_AGENT_DATA_DIR: /app/data
      APP_PORT: "${APP_PORT:-8020}"
    # Docker bridge egress is blocked on the production host. Host networking
    # lets this single-container service reach DeepSeek through the host route.
    network_mode: host
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "${APP_PORT:-8020}", "--workers", "1"]
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_PORT'] + '/healthz', timeout=5)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
